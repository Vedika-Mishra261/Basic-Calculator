<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Calculator card -->
  <main class="calculator" aria-label="Basic calculator">
    <header class="calculator__header">
      <h1 class="calculator__title">Basic Calculator</h1>
    </header>

    <!-- Display screen: small line shows the operation, large line shows the value -->
    <section class="display" aria-label="Calculator display">
      <div id="expression" class="display__expression"></div>
      <div
        id="result"
        class="display__value"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >0</div>
    </section>

    <!-- Button grid -->
    <div id="buttons" class="buttons" aria-label="Calculator buttons">
      <button type="button" class="button button--clear" data-action="clear" aria-label="Clear">C</button>
      <button type="button" class="button button--operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

      <button type="button" class="button" data-action="number" data-value="7">7</button>
      <button type="button" class="button" data-action="number" data-value="8">8</button>
      <button type="button" class="button" data-action="number" data-value="9">9</button>
      <button type="button" class="button button--operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

      <button type="button" class="button" data-action="number" data-value="4">4</button>
      <button type="button" class="button" data-action="number" data-value="5">5</button>
      <button type="button" class="button" data-action="number" data-value="6">6</button>
      <button type="button" class="button button--operator" data-action="operator" data-value="−" aria-label="Subtract">−</button>

      <button type="button" class="button" data-action="number" data-value="1">1</button>
      <button type="button" class="button" data-action="number" data-value="2">2</button>
      <button type="button" class="button" data-action="number" data-value="3">3</button>
      <button type="button" class="button button--operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button type="button" class="button button--zero" data-action="number" data-value="0">0</button>
      <button type="button" class="button" data-action="decimal" data-value="." aria-label="Decimal point">.</button>
      <button type="button" class="button button--equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
